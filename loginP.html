
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Professor | Reclass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="IMGS/logoico.ico" type="image/x-icon">
</head>

<body>
    <header class="padheader">
        <div class="container vis-btn-logo">
            <div class="logo">
                <img src="IMGS/reclasslogo.jpeg" alt="Logo Reclass">
            </div>

            <nav class="btns-header">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="login.html">Sou Aluno</a></li>
                </ul>
            </nav>

            <button class="mobile-menu-toggle" aria-label="Abrir menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <main>
        <section class="pad-log">
            <div class="login-container">
                <h2>Login do Professor</h2>

                <form id="formLoginProfessor">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Seu e-mail cadastrado"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="senha">
                            <i class="fas fa-lock"></i> Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Sua senha"
                            autocomplete="current-password"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login" id="btnEntrar">
                        Entrar no Painel
                    </button>

                    <p id="mensagem" role="status" aria-live="polite"></p>
                </form>

                <div class="login-footer">
                    <p>Ainda não tem conta?
                        <a href="cadastro.html">Cadastre-se aqui</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Reclass - Sistema de Reposição de Aulas</p>
        </div>
    </footer>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const formulario = document.getElementById('formLoginProfessor');
        const mensagem = document.getElementById('mensagem');
        const botao = document.getElementById('btnEntrar');

        formulario.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            mensagem.textContent = 'Verificando acesso...';
            botao.disabled = true;

            try {
                // Autenticar a conta no Supabase
                const { data: login, error: erroLogin } =
                    await supabase.auth.signInWithPassword({
                        email: email,
                        password: senha
                    });

                if (erroLogin) {
                    throw new Error('E-mail ou senha incorretos.');
                }

                // Consultar o perfil do usuário autenticado
                const { data: perfil, error: erroPerfil } =
                    await supabase
                        .from('profiles')
                        .select('nome, tipo_usuario')
                        .eq('id', login.user.id)
                        .single();

                if (erroPerfil || !perfil) {
                    await supabase.auth.signOut();
                    throw new Error(
                        'Não foi possível localizar seu perfil. Verifique o cadastro.'
                    );
                }

                // Impedir que alunos entrem no painel do professor
                if (perfil.tipo_usuario !== 'professor') {
                    await supabase.auth.signOut();

                    throw new Error(
                        'Esta conta não está cadastrada como professor.'
                    );
                }

                mensagem.textContent = 'Login realizado com sucesso!';

                // Altere se o painel ainda tiver outro nome ou extensão
                window.location.href = 'dashP.html';

            } catch (erro) {
                mensagem.textContent =
                    erro.message || 'Não foi possível entrar. Tente novamente.';
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
