
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Aluno | Reclass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="IMGS/logoico.ico" type="image/x-icon">
</head>

<body>

<header class="padheader">
    <div class="container vis-btn-logo">

        <div class="logo">
            <img src="IMGS/reclasslogo.jpeg" alt="Wiz Logo">
        </div>

        <nav class="btns-header">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="login.html">Escolher perfil</a></li>
            </ul>
        </nav>

        <button class="mobile-menu-toggle" aria-label="Abrir menu">
            <i class="fas fa-bars"></i>
        </button>

    </div>
</header>

<main>
    <section class="pad-log">

        <div class="login-container">

            <h2>Login do Aluno</h2>

            <form id="formLogin">

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Seu e-mail cadastrado"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="senha"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        required>
                </div>

                <button
                    type="submit"
                    id="btnLogin"
                    class="btn btn-primary btn-login">

                    Entrar

                </button>

                <p id="mensagemLogin" role="status" aria-live="polite"></p>

            </form>

            <div class="login-footer">
                <p>
                    Ainda não tem conta?
                    <a href="cadastro.html">Cadastre-se aqui</a>
                </p>
            </div>

        </div>

    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <p>
            &copy; 2026 Reclass - Sistema de Reposição de Aulas
        </p>
    </div>
</footer>

<script type="module">
    import { supabase } from './js/supabase.js';

    const form = document.getElementById('formLogin');
    const botao = document.getElementById('btnLogin');
    const mensagem = document.getElementById('mensagemLogin');

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('password').value;

        botao.disabled = true;
        botao.textContent = 'Entrando...';
        mensagem.textContent = '';

        try {
            // Autenticar o aluno pelo Supabase Auth
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: senha
            });

            if (error) {
                throw error;
            }

            // Consultar o perfil do usuário autenticado
            const { data: perfil, error: erroPerfil } = await supabase
                .from('profiles')
                .select('nome, tipo_usuario')
                .eq('id', data.user.id)
                .single();

            if (erroPerfil) {
                await supabase.auth.signOut();
                throw erroPerfil;
            }

            // Impedir que uma conta de professor entre como aluno
            if (perfil.tipo_usuario !== 'aluno') {
                await supabase.auth.signOut();

                mensagem.textContent =
                    'Esta conta não está cadastrada como aluno. ' +
                    'Acesse a opção de login de professor.';

                return;
            }

            // O Supabase mantém a sessão de autenticação no navegador.
            // O painel ainda precisa ser migrado do PHP para utilizá-la.
           window.location.href = 'dashA.html';

        } catch (erro) {
            console.error('Erro no login:', erro);

            const erroTexto = (erro.message || '').toLowerCase();

            if (
                erroTexto.includes('email not confirmed') ||
                erroTexto.includes('email_not_confirmed')
            ) {
                mensagem.textContent =
                    'Confirme seu e-mail antes de entrar.';
            } else if (
                erroTexto.includes('invalid login credentials')
            ) {
                mensagem.textContent =
                    'E-mail ou senha incorretos. Confira seus dados.';
            } else {
                mensagem.textContent =
                    'Não foi possível entrar: ' +
                    (erro.message || 'verifique sua conexão.');
            }

        } finally {
            botao.disabled = false;
            botao.textContent = 'Entrar';
        }
    });
</script>

</body>
</html>
